<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trinkrechner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <div class="container mt-4">
    <h1>Trinkrechner</h1>
    <p>Berechne, wie viel du am Tag trinken solltest.</p>

    <label>Gewicht in kg</label>
    <input class="form-control mb-3" type="number" id="gewicht">

    <label>Alter</label>
    <input class="form-control mb-3" type="number" id="alter">

    <label>Machst du heute Sport?</label>
    <select class="form-select mb-3" id="sport">
      <option value="nein">Nein</option>
      <option value="ja">Ja</option>
    </select>

    <label>Schon getrunken in Liter</label>
    <input class="form-control mb-3" type="number" id="getrunken" value="0" step="0.1">

    <button class="btn btn-primary" onclick="berechnen()">Berechnen</button>

    <p class="mt-3" id="ergebnis"></p>
  </div>

  <script>
    function berechnen() {
      let gewicht = Number(document.getElementById("gewicht").value);
      let alter = Number(document.getElementById("alter").value);
      let sport = document.getElementById("sport").value;
      let getrunken = Number(document.getElementById("getrunken").value);

      if (gewicht <= 0 || alter <= 0 || getrunken < 0) {
        document.getElementById("ergebnis").innerHTML = "Bitte alles richtig ausfüllen.";
        return;
      }

      let wasserProKilo = 0.035;

      if (alter < 15) {
        wasserProKilo = 0.04;
      }

      if (alter >= 51) {
        wasserProKilo = 0.03;
      }

      let gesamt = gewicht * wasserProKilo;
      let essen = gesamt / 3;
      let trinken = gesamt - essen;

      if (sport == "ja") {
        trinken = trinken + 0.5;
      }

      let rest = trinken = getrunken;
      if (rest < 0) {
        rest = 0;
      }

      document.getElementById("ergebnis").innerHTML =
        "Wasser aus Essen: " + essen.toFixed(1) + " Liter<br>" +
        "Du solltest trinken: " + trinken.toFixed(1) + " Liter<br>" +
        "Noch zu trinken: " + rest.toFixed(1) + " Liter";
    }
  </script>
</body>
</html>
